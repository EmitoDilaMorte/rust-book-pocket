name: pocket

on:
  push:
    tags:
      - "pocket-v*"
  pull_request:
    paths:
      - "pocket/**"
      - "src/**"
      - "quizzes/**"
      - "listings/**"
      - "words.dic"
      - ".github/workflows/pocket.yml"
  workflow_dispatch:

concurrency:
  group: pocket-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.2"
  MDBOOK_QUIZ_VERSION: "0.5.0"

jobs:
  # Lite build: app plus the book, no on-device compiler (~17 MB). Runs on every
  # pull request, which is enough to catch book, quiz or app regressions.
  lite:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache mdBook binaries
        id: mdbook-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-quiz
          key: mdbook-${{ runner.os }}-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_QUIZ_VERSION }}

      - name: Install mdBook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: |
          cargo install mdbook --version "$MDBOOK_VERSION" --locked
          cargo install mdbook-quiz --version "$MDBOOK_QUIZ_VERSION" --locked

      - name: Build book bundle
        run: bash pocket/scripts/build-book.sh

      - name: Unit tests
        working-directory: pocket
        run: bash gradlew :app:testDebugUnitTest

      - name: Lint
        working-directory: pocket
        run: bash gradlew :app:lintDebug

      - name: Assemble lite APK
        working-directory: pocket
        run: bash gradlew :app:assembleRelease -Ppocket.updateRepo="${GITHUB_REPOSITORY}"

      - name: Upload lite APK
        uses: actions/upload-artifact@v4
        with:
          name: rust-book-pocket-lite
          path: pocket/app/build/outputs/apk/release/*.apk

  # Full build: bundles the Rust toolchain so code can be compiled on the phone
  # (~199 MB). Only on tags and manual runs, because it downloads and repacks
  # several hundred megabytes.
  full:
    needs: lite
    if: startsWith(github.ref, 'refs/tags/pocket-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        run: |
          cargo install mdbook --version "$MDBOOK_VERSION" --locked
          cargo install mdbook-quiz --version "$MDBOOK_QUIZ_VERSION" --locked

      - name: Build book bundle
        run: bash pocket/scripts/build-book.sh

      # The toolchain archive is expensive to rebuild, so cache it keyed on the
      # pinned package list.
      - name: Cache toolchain archive
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: pocket/app/src/main/assets/toolchain/toolchain.zip
          key: toolchain-${{ runner.os }}-${{ hashFiles('pocket/spikes/local-exec/toolchain-packages.txt') }}

      - name: Build toolchain archive
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: bash pocket/spikes/local-exec/build-toolchain.sh

      - name: Assemble full APK
        working-directory: pocket
        env:
          POCKET_KEYSTORE_PATH: ${{ secrets.POCKET_KEYSTORE_PATH }}
          POCKET_KEYSTORE_PASSWORD: ${{ secrets.POCKET_KEYSTORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: bash gradlew :app:assembleRelease -Ppocket.updateRepo="${GITHUB_REPOSITORY}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev}"
          cp pocket/app/build/outputs/apk/release/*.apk "dist/rust-book-pocket-${version}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: rust-book-pocket-full
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/pocket-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --title "Rust Book Pocket $GITHUB_REF_NAME" \
            --generate-notes
